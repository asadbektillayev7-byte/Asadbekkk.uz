<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Asadbekkk. Student. Still exploring. A personal homepage in motion.">
  <title>Asadbekkk — Personal Space</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" as="image" href="assets/cutouts/cutout-5.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script defer src="content.js"></script>
  <script defer src="portrait.js"></script>
  <script defer src="visit-opening.js"></script>
  <script defer src="app.js"></script>
</head>
<body class="is-loading">
  <main class="homepage" aria-label="Asadbekkk’s personal homepage">
    <div class="atmosphere" aria-hidden="true"></div>
    <canvas class="portrait-canvas" id="portrait-canvas" role="img" aria-label="Asadbekkk facing the camera in a school T-shirt, rendered as a portrait made of light particles"></canvas>
    <img class="portrait-fallback" id="portrait-fallback" src="assets/cutouts/cutout-5.webp" alt="Asadbekkk facing the camera in a school T-shirt" aria-hidden="true">
    <header class="site-header">
      <a class="brand" href="./" aria-label="Asadbekkk — home">Asadbekkk</a>
      <div class="header-right"><span class="home-label" aria-current="page">HOME</span><button class="intro-control" id="intro-control">Skip intro <span aria-hidden="true">↗</span></button></div>
    </header>
    <div class="opening-mark" aria-hidden="true"><span></span></div>
    <div class="title-stage" id="title-stage">
      <div class="name-word metal-word" id="name-word" aria-hidden="true"></div>
      <h1 class="portfolio-word metal-word" id="portfolio-word" aria-label="Asadbekkk’s portfolio">PORTFOLIO</h1>
    </div>
    <footer class="home-footer">
      <p class="descriptor"><strong>Student.</strong> <em>Still exploring.</em></p>
      <div class="photo-picker" aria-label="Choose a portrait"><div class="picker-label"><span>Different moments. Same me.</span><span id="photo-count">03 / 04</span></div><div class="photo-thumbnails" id="photo-thumbnails"></div></div>
      <button class="next-photo" id="next-photo"><span class="next-icon" aria-hidden="true">↗</span><span>Next photo</span></button>
    </footer>
    <p class="sr-only" id="photo-status" aria-live="polite"></p>
    <noscript><style>.is-loading .title-stage,.is-loading .site-header,.is-loading .home-footer{opacity:1}.portrait-fallback{opacity:.72}.photo-picker,.next-photo,.intro-control{display:none}</style></noscript>
  </main>
</body>
</html>
